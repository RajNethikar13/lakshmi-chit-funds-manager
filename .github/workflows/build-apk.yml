name: Build Lakshmi Chit Manager APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup app files
        run: |
          cp pubspec.yaml /tmp/pubspec.yaml
          cp main.dart /tmp/main.dart
          cp db.dart /tmp/db.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --project-name lakshmi_chit_funds_manager \
            --platforms=android \
            --org com.lakshmi.chit .

      - name: Restore app source
        run: |
          cp /tmp/pubspec.yaml pubspec.yaml
          mkdir -p lib
          cp /tmp/main.dart lib/main.dart
          cp /tmp/db.dart lib/db.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lakshmi-chit-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
